services:
  django-web:
    build:
      context: .
      dockerfile: Dockerfile
    command: /app/entrypoint.prod.sh
    volumes:
      - staticfiles:/app/staticfiles
    env_file:
      - .env.prod
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.create_connection(('127.0.0.1', 8000), 2); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl/_.behawiorysta.warszawa.pl_private_key.key:/etc/ssl/private/_.behawiorysta.warszawa.pl_private_key.key:ro
      - ./ssl/behawiorysta.warszawa.pl_ssl_certificate.cer:/etc/ssl/certs/behawiorysta.warszawa.pl_ssl_certificate.cer:ro
      - staticfiles:/staticfiles:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./mime.types:/etc/nginx/mime.types:ro
    restart: unless-stopped
    depends_on:
      django-web:
        condition: service_healthy

volumes:
  staticfiles:
