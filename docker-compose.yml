services:
  django-web:
    build:
      context: .
      dockerfile: Dockerfile
    command: /app/entrypoint.prod.sh
    volumes:
      - staticfiles:/app/staticfiles
      - database:/app/data
    environment:
      DATABASE_PATH: /app/data/db.sqlite3
      TRUST_PROXY_IP: "true"
    env_file:
      - .env.prod
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.create_connection(('127.0.0.1', 8000), 2); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    env_file:
      - .env.ssl
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - staticfiles:/staticfiles:ro
      - ./nginx.conf:/etc/nginx/project/nginx.conf:ro
      - ./nginx.bootstrap.conf:/etc/nginx/project/nginx.bootstrap.conf:ro
      - ./deploy/nginx-security-headers.conf:/etc/nginx/project/security-headers.conf:ro
      - ./deploy/nginx-entrypoint.sh:/usr/local/bin/project-nginx-entrypoint:ro
      - ./deploy/enable-https.sh:/usr/local/bin/enable-https:ro
      - ./deploy/render-nginx.sh:/usr/local/bin/render-nginx:ro
      - ./mime.types:/etc/nginx/mime.types:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/project-nginx-entrypoint"]
    restart: unless-stopped
    depends_on:
      django-web:
        condition: service_healthy

  certbot:
    image: certbot/certbot:v4.2.0
    profiles: ["maintenance"]
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot

volumes:
  staticfiles:
  database:
