events {
   worker_connections 1024;
}

http {
   include /etc/nginx/mime.types;
   server_tokens off;

   server {
       listen 80;
       server_name behawiorysta.warszawa.pl www.behawiorysta.warszawa.pl;

       location /.well-known/acme-challenge/ {
           root /var/www/certbot;
       }

       location / {
           return 503 "HTTPS configuration is being initialized.\n";
           add_header Content-Type text/plain;
       }
   }
}
