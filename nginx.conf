# Sets the max number of simultaneous connections that can be opened by a worker process
events {
   worker_connections 1024;
}

http {
   include /etc/nginx/mime.types;
   server {
       listen 80;
       server_name behawiorysta.warszawa.pl www.behawiorysta.warszawa.pl;

       return 301 https://$host$request_uri;
   }

   server {
       listen 443 ssl;
       server_name behawiorysta.warszawa.pl www.behawiorysta.warszawa.pl;

       ssl_certificate /etc/ssl/certs/behawiorysta.warszawa.pl_ssl_certificate.cer;
       ssl_certificate_key /etc/ssl/private/_.behawiorysta.warszawa.pl_private_key.key;

       ssl_protocols TLSv1.2 TLSv1.3;
       ssl_ciphers HIGH:!aNULL:!MD5;

       location /static/ {
           alias /staticfiles/;
       }

       location / {
           proxy_pass http://django-web:8000;

           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
       }
   }
}