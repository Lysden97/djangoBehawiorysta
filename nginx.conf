# Sets the max number of simultaneous connections that can be opened by a worker process
events {
   worker_connections 1024;
}

http {
   include /etc/nginx/mime.types;
   server_tokens off;

   upstream django_app {
       server django-web:8000;
   }

   server {
       listen 80;
       server_name behawiorysta.warszawa.pl www.behawiorysta.warszawa.pl;

       location /.well-known/acme-challenge/ {
           root /var/www/certbot;
       }

       location / {
           return 301 https://$host$request_uri;
       }
   }

   server {
       listen 443 ssl;
       http2 on;
       server_name behawiorysta.warszawa.pl www.behawiorysta.warszawa.pl;

       ssl_certificate /etc/letsencrypt/live/behawiorysta.warszawa.pl/fullchain.pem;
       ssl_certificate_key /etc/letsencrypt/live/behawiorysta.warszawa.pl/privkey.pem;

       ssl_protocols TLSv1.2 TLSv1.3;
       ssl_ciphers HIGH:!aNULL:!MD5;
       ssl_prefer_server_ciphers off;

       client_max_body_size 10m;

       add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
       add_header X-Content-Type-Options "nosniff" always;
       add_header X-Frame-Options "DENY" always;
       add_header Referrer-Policy "strict-origin-when-cross-origin" always;

       location /static/ {
           alias /staticfiles/;
           expires 30d;
           add_header Cache-Control "public, max-age=2592000, immutable";
           access_log off;
       }

       location / {
           proxy_pass http://django_app;
           proxy_http_version 1.1;
           proxy_redirect off;

           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
           proxy_set_header X-Forwarded-Host $host;
           proxy_set_header X-Forwarded-Port $server_port;

           proxy_connect_timeout 10s;
           proxy_send_timeout 30s;
           proxy_read_timeout 30s;
       }
   }
}
