# Sets the max number of simultaneous connections that can be opened by a worker process
events {
   worker_connections 1024;
}

http {
   include /etc/nginx/mime.types;
   server_tokens off;

   map $uri $static_cache_control {
       default "no-cache";
       "~\.[0-9a-f]{12}\.[^/]+$" "public, max-age=2592000, immutable";
   }

   upstream django_app {
       zone django_app 64k;
       resolver 127.0.0.11 valid=5s;
       resolver_timeout 2s;
       server django-web:8000 resolve;
   }

   server {
       listen 80;
       server_name ${LETSENCRYPT_DOMAIN} ${LETSENCRYPT_WWW_DOMAIN};

       location /.well-known/acme-challenge/ {
           root /var/www/certbot;
       }

       location / {
           return 301 https://${LETSENCRYPT_DOMAIN}$request_uri;
       }
   }

   server {
       listen 443 ssl;
       http2 on;
       server_name ${LETSENCRYPT_DOMAIN} ${LETSENCRYPT_WWW_DOMAIN};

       ssl_certificate /etc/letsencrypt/live/${LETSENCRYPT_DOMAIN}/fullchain.pem;
       ssl_certificate_key /etc/letsencrypt/live/${LETSENCRYPT_DOMAIN}/privkey.pem;

       if ($host != "${LETSENCRYPT_DOMAIN}") {
           return 301 https://${LETSENCRYPT_DOMAIN}$request_uri;
       }

       ssl_protocols TLSv1.2 TLSv1.3;
       ssl_ciphers HIGH:!aNULL:!MD5;
       ssl_prefer_server_ciphers off;

       client_max_body_size 64k;

       include /etc/nginx/project/security-headers.conf;

       location /static/ {
           alias /staticfiles/;
           # A local add_header prevents inheritance from the server block.
           include /etc/nginx/project/security-headers.conf;
           add_header Cache-Control $static_cache_control;
           access_log off;
       }

       location / {
           proxy_pass http://django_app;
           proxy_http_version 1.1;
           proxy_redirect off;

           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
           proxy_set_header X-Forwarded-Host $host;
           proxy_set_header X-Forwarded-Port $server_port;

           proxy_connect_timeout 10s;
           proxy_send_timeout 30s;
           proxy_read_timeout 30s;
       }
   }
}
